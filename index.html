<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>QuickNotes</h1>
      <p>Capture ideas quickly and stay organized.</p>
    </header>

    <main>
      <section>
        <h2>Add a Note</h2>
        <form id="note-form">
          <div class="form-group">
            <label for="note-input">Note Text</label>
            <input type="text" id="note-input" placeholder="Type a note..." />
          </div>

          <div class="form-group">
            <label for="note-category">Category</label>
            <select id="note-category">
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Study">Study</option>
            </select>
          </div>

          <button type="submit" id="add-btn">Add Note</button>
        </form>
        <p id="error-message"></p>
      </section>

      <section>
        <div class="notes-header">
          <h2>Your Notes</h2>
          <button type="button" id="clear-all-btn" class="clear-all-btn">
            Clear All
          </button>
        </div>

        <label for="search-input">Search Notes</label>
        <input type="text" id="search-input" placeholder="Search notes..." />

        <p id="note-count">You have no notes yet.</p>
        <ul id="notes-list"></ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 QuickNotes. Built for Web Foundations Project 1.</p>
    </footer>
  </body>
</html>
